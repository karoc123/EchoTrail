[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracevoyage_gen"
version = "0.1.0"
description = "Static site generator for TraceVoyage travel journals."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "pydantic>=2.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
scraper = ["requests>=2.31", "beautifulsoup4>=4.12", "playwright>=1.40"]

[project.scripts]
tracevoyage-gen = "tracevoyage_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tracevoyage_gen*"]

[tool.setuptools.package-data]
tracevoyage_gen = [
    "default_templates/*.html",
    "default_assets/**/*",
    "default_assets/**/.gitkeep",
]
