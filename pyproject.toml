[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echotrail_gen"
version = "0.1.0"
description = "Static site generator for EchoTrail travel journals."
requires-python = ">=3.10"
dependencies = [
    "jinja2>=3.1",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
markdown = ["markdown>=3.5"]

[project.scripts]
echotrail-gen = "echotrail_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["echotrail_gen*"]
