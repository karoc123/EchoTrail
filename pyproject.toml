[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echotrail_gen"
version = "0.1.0"
description = "Static site generator for EchoTrail travel journals."
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "markdown>=3.5",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
echotrail-gen = "echotrail_gen.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["echotrail_gen*"]
